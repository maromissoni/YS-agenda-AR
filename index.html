<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>YS Forum AR</title>
  <meta name="theme-color" content="#141414">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="YS Forum AR">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "./lib/three/three.module.js", "three/addons/": "./lib/three/addons/" } }
  </script>
</head>
<body>
  <div id="ar"></div>

  <div id="ui">
    <div id="banner" class="banner" hidden></div>

    <section id="start" class="screen">
      <div class="screen-card">
        <span class="tag">Lo-fi prototype</span>
        <h1 id="start-title">YS Forum AR</h1>
        <p>Point your camera at the agenda poster. No poster? Point at any wall and tap <strong>Place agenda here</strong>.</p>
        <button id="btn-start" class="btn primary">Start</button>
        <p id="start-status" class="status"></p>
      </div>
    </section>

    <nav id="bar" class="bar" hidden>
      <button id="btn-place">Place agenda here</button>
      <button id="btn-show-agenda" hidden>Show agenda</button>
      <button id="btn-hunt" class="primary">Scavenger hunt</button>
    </nav>

    <div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
