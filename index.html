<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Youth Speak AR</title>
  <meta name="theme-color" content="#7551cc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Youth Speak AR">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css?v=11">
  <!--
    This product includes the XR Engine software developed by Niantic Spatial, Inc.
    Copyright (c) 2026 Niantic Spatial, Inc. All rights reserved.
    Licensed under the XR Engine License Agreement: lib/xr/LICENSE (includes the disclaimer of warranties).
  -->
  <script src="lib/xr/xr.js?v=11" async data-preload-chunks="slam"></script>
  <script type="importmap">
    { "imports": { "three": "./lib/three/three.module.js"} }
  </script>
</head>
<body>
  <canvas id="xr"></canvas>

  <div id="ui">
    <div id="reticle" class="reticle" hidden><span></span></div>
    <div id="scan-frame" class="scan-frame" hidden></div>
    <div id="banner" class="banner" hidden></div>

    <section id="start" class="screen">
      <div class="screen-card">
        <img class="mark" src="logo/logo.png" alt="">
        <h1>Youth Speak AR</h1>
        <p>First point the camera at the floor and move the phone slowly for a few seconds. Then aim at a wall about 1.5 m away and tap <strong>Place here</strong>. Tap the logo to open the agenda.</p>
        <button id="btn-start" class="btn primary">Start</button>
        <p id="start-status" class="status"></p>
        <p class="status">Version <span id="app-version">?</span></p>
        <p class="credit">AR engine: XR Engine by Niantic Spatial, Inc. &middot; <a href="lib/xr/LICENSE" target="_blank" rel="noopener">License</a></p>
      </div>
    </section>

    <nav id="bar" class="bar" hidden>
      <button id="btn-place" class="primary">Place here</button>
      <button id="btn-stop-scan" hidden>Stop scanning</button>
      <button id="btn-hunt">Scavenger hunt</button>
    </nav>

    <div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </div>

  <script type="module" src="app.js?v=11"></script>
</body>
</html>
